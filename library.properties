name=RoboSnoopy
version=1.0.0
author=Dennis Hoelscher <dennis@fluxgarage.com>
maintainer=Dennis Hoelscher <dennis@fluxgarage.com>
sentence=A pixel-art Snoopy mascot for OLED displays that reflects emotions and walks around the screen.
paragraph=Based on the FluxGarage RoboEyes library: a pixel-art Snoopy walks to positions, wanders around in idle mode, changes mood expressions (happy, tired, angry, default, surprised, curious) and plays one-shot animations (laugh, confused, blink, sleep) with smooth motion. Uses the Adafruit GFX library. Personal / educational use only.
category=Display
